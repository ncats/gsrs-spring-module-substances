# Generates resolvable URLs for ix.ginas.models.v1.Code entries.
#
# The table of code systems used to live in an external "codeSystem.json" file and is now declared
# inline below, so nothing is read from the filesystem or from a classpath resource at runtime.
#
# The "parameters" block has exactly two attributes: "class" names the CodeSystemUrlGenerator
# implementation to use and "codeSystems" holds its data.  There is no intermediate "json" level.
#
# Each "codeSystems" entry maps a code system name to a URL template in which "$CODE$" is replaced
# by the code value and "$CODETEXT$" by the code text.  Names are matched case-insensitively and
# must be unique.
gsrs.entityProcessors.list.CodeProcessor =
    {
      "entityClassName" = "ix.ginas.models.v1.Code",
      "processor" = "gsrs.module.substance.processors.CodeProcessor",
      "order" = 1800,
      "parameters": {
        "class" = "gsrs.module.substance.datasource.DefaultCodeSystemUrlGenerator",
        "codeSystems": {
            "JMPR-PESTICIDE RESIDUE" = "http://www.codexalimentarius.net/pestres/data/pesticides/details.html?id=$CODE$"
            "CODEX ALIMENTARIUS (GSFA)" = "http://www.fao.org/gsfaonline/additives/details.html?id=$CODE$"
            "Food Contact Substance Notif, (FCN No.)" = "http://www.accessdata.fda.gov/scripts/fcn/fcnDetailNavigation.cfm?rpt=fcslisting&id=$CODE$"
            "JECFA EVALUATION" = "http://apps.who.int/food-additives-contaminants-jecfa-database/chemical.aspx?chemINS=$CODE$"
            "IUPHAR" = "http://www.guidetopharmacology.org/GRAC/LigandDisplayForward?ligandId=$CODE$"
            "ALANWOOD" = "http://www.alanwood.net/pesticides/$CODE$"
            "MERCK INDEX" = "https://merckindex.rsc.org/monographs/$CODE$"
            "INN" = "https://extranet.who.int/soinn/mod/page/view.php?id=137&inn_n=$CODE$"
            "GRIN" = "https://npgsweb.ars-grin.gov/gringlobal/taxon/taxonomydetail?id=$CODE$"
            "DEA NO." = "http://forendex.southernforensic.org/index.php/detail/index/$CODE$"
            "DRUGBANK" = "http://www.drugbank.ca/drugs/$CODE$"
            "PHAROS" = "https://pharos.nih.gov/idg/targets/$CODE$"
            "STARI" = "https://cfsanappsinternal.fda.gov/scripts/stari/?action=main.detail&id=$CODE$"
            "PFAF" = "http://www.pfaf.org/user/Plant.aspx?LatinName=$CODE$"
            "CAS" = "https://commonchemistry.cas.org/detail?cas_rn=$CODE$"
            "ChEMBL" = "https://www.ebi.ac.uk/chembl/compound/inspect/$CODE$"
            "NDF-RT" = "https://nciterms.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=VA_NDFRT&code=$CODE$"
            "RXCUI" = "https://rxnav.nlm.nih.gov/REST/rxcui/$CODE$/allProperties.xml?prop=all"
            "WHO-ATC" = "http://www.whocc.no/atc_ddd_index/?code=$CODE$&showdescription=yes"
            "[CLINICAL_TRIALS.GOV]" = "https://clinicaltrials.gov/ct2/show/$CODE$"
            "ITIS" = "https://www.itis.gov/servlet/SingleRpt/SingleRpt?search_topic=TSN&search_value=$CODE$"
            "NCBI TAXONOMY" = "https://www.ncbi.nlm.nih.gov/Taxonomy/Browser/wwwtax.cgi?mode=Info&id=$CODE$"
            "USDA PLANTS" = "https://plants.sc.egov.usda.gov/home/plantProfile?symbol=$CODE$"
            "PUBCHEM" = "https://pubchem.ncbi.nlm.nih.gov/compound/$CODE$"
            "CFR" = "https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfCFR/CFRSearch.cfm?fr=$CODE$"
            "NCI_THESAURUS" = "https://ncit.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=NCI%20Thesaurus&code=$CODE$"
            "MESH" = "https://www.ncbi.nlm.nih.gov/mesh/$CODE$"
            "UNIPROT" = "http://www.uniprot.org/uniprot/$CODE$"
            "RS_ITEM_NUM" = "https://store.usp.org/product/$CODE$"
            "USAN" = "https://searchusan.ama-assn.org/finder/usan/search/$CODE$/relevant/1/"
            "NSC" = "https://dtp.cancer.gov/dtpstandard/servlet/dwindex?searchtype=NSC&outputformat=html&searchlist=$CODE$"
            "EPA CompTox" = "https://comptox.epa.gov/dashboard/chemical/details/$CODE$"
            "DailyMed" = "https://dailymed.nlm.nih.gov/dailymed/search.cfm?adv=1&query=($CODE$)"
            "Catalogue of Life" = "https://www.catalogueoflife.org/data/taxon/$CODE$"
        }
      }
    }

